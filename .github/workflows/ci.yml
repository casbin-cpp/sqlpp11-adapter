name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: "Build and Test on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            mysql-server \
            pkg-config
            
      - name: Install Casbin-CPP
        run: |
          git clone https://github.com/casbin/casbin-cpp.git
          cd casbin-cpp
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . --target install
          cd ../..
          
      - name: Install sqlpp11
        run: |
          git clone https://github.com/rbock/sqlpp11.git
          cd sqlpp11
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build . --target install
          cd ../..
          
      - name: Setup MySQL
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start mysql.service
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS casbin;"
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          
      - name: Build
        run: |
          cd build
          cmake --build . --config Release -j $(nproc)
          
      - name: Run tests
        run: |
          cd build
          ./test || echo "Tests require MySQL connection"
